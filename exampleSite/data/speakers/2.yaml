text: "Prof. B. Ravindran heads the Department of Data Science and Artificial Intelligence (DSAI), the Wadhwani School of Data Science and Artificial Intelligence (WSAI), the Robert Bosch Centre for Data Science & Artificial Intelligence (RBCDSAI) and the Centre for Responsible AI (CeRAI) at IIT Madras. He is honoured with the position as Elected Fellow of the Association for Advancement of Artificial Intelligence (AAAI) for significant contributions to reinforcement learning foundations and applications in 2025."
