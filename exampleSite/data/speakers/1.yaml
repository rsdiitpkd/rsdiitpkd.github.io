text: "Prof. Deepak Dhar is an Indian theoretical physicist and a distinguished professor at the International Center for Theoretical Sciences, Tata Institute of Fundamental Research, Bengaluru. Known for his research on statistical physics and stochastic processes, Prof. Dhar is an elected fellow of all three major Indian science academies – the Indian Academy of Sciences, the Indian National Science Academy and the National Academy of Sciences, India. He received the Boltzmann Medal in Physics in 2022, the first person to receive it. The Government of India also awarded him the Padma Bhushan in 2023."
